version: "3.9"

services:

  app:
    build: .
    container_name: laravel_app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8
    container_name: laravel_db
    restart: always
    environment:
      MYSQL_DATABASE: lms_system
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel

  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: always
    networks:
      - laravel

  queue:
    build: .
    container_name: laravel_queue
    restart: always
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    depends_on:
      - app
      - redis
      - db
    networks:
      - laravel

  scheduler:
    build: .
    container_name: laravel_scheduler
    restart: always
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    depends_on:
      - app
      - db
      - redis
    networks:
      - laravel

volumes:
  dbdata:

networks:
  laravel:
    driver: bridge
